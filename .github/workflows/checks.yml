name: Docker checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: starter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker compose build
      - run: docker compose run --rm --no-deps backend python -m unittest discover -s tests -v
      - run: docker compose run --rm --no-deps frontend npm run build
      - run: docker compose up -d --wait --wait-timeout 90
      - run: docker compose exec -T frontend node tests/smoke.mjs
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
