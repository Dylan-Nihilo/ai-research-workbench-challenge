services:
  backend:
    build: ./backend
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      RESEARCH_DB_PATH: /data/tasks.sqlite3
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - research-data:/data
      - ./backend/app:/app/app:ro
      - ./backend/tests:/app/tests:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2))['status'] == 'ok'"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

  frontend:
    build: ./frontend
    init: true
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/tests:/app/tests:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12

volumes:
  research-data:
